[project]
name = "linkedin-profile-api"
version = "0.1.0"
description = "Low-volume authenticated LinkedIn profile API proof of concept"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]>=0.116.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = "-q"
markers = ["live: calls LinkedIn and is disabled unless explicitly enabled"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
